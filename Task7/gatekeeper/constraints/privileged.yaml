# Constraint: PrivilegedContainer
#
# Applies the `PrivilegedContainer` ConstraintTemplate cluster-wide to every
# Pod. `enforcementAction: deny` blocks admission; the built-in audit engine
# also reports existing violating pods (see `kubectl get k8sprivcontainers`).
#
# Policy requirement: "Нельзя использовать privileged: true."
apiVersion: constraints.gatekeeper.sh/v1beta1
kind: PrivilegedContainer
metadata:
  name: privileged-container
spec:
  match:
    kinds:
      - apiGroups: [""]
        kinds: ["Pod"]
  enforcementAction: deny
